name: 构建并发布 APK

# 有新提交推到主分支就自动构建；也可以在 Actions 页面手动触发一次。
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: 构建 Release APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 直接用 GitHub 机器上预装的 Android SDK，并补齐本项目需要的组件。
      # 不依赖第三方 action，少一层出错的可能。
      - name: 准备 Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK 目录: $SDK"
          for d in "$SDK"/cmdline-tools/*/bin; do
            if [ -d "$d" ]; then PATH="$d:$PATH"; fi
          done
          export PATH
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "未找到 sdkmanager，下载 cmdline-tools"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/ct.zip -d /tmp/ct
            mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
            PATH="$SDK/cmdline-tools/latest/bin:$PATH"
            export PATH
          fi
          sdkmanager --version
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
          } >> "$GITHUB_ENV"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 仓库里的 wrapper 指向腾讯云镜像（方便本机在国内下载）；
      # GitHub 的机器在国外，换成官方分发源更稳。
      - name: CI 切换到官方 Gradle 分发源
        run: sed -i 's#mirrors\.cloud\.tencent\.com/gradle/#services.gradle.org/distributions/#g' gradle/wrapper/gradle-wrapper.properties

      - name: 读取版本号
        id: version
        run: |
          name=$(grep -oP "versionName\s+'\K[^']+" app/build.gradle | head -1)
          code=$(grep -oP "versionCode\s+\K[0-9]+" app/build.gradle | head -1)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "版本号：${name}（versionCode ${code}）"

      # 用仓库 Secrets 里的正式签名证书给 APK 签名，
      # 这样每次出的包签名一致，可以直接覆盖安装升级。
      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > laxiang-release.keystore
            printf 'storeFile=laxiang-release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > signing.properties
            echo "已启用正式签名。"
          else
            echo "::warning::未配置签名 Secrets，将回退到 debug 签名（不能覆盖正式包升级）。"
          fi

      - name: 构建 APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # 磁盘上的文件名用纯 ASCII，避免非 ASCII 在文件系统/上传环节被吞；
      # 中文名留到发布后用 GitHub API 显式设置（见最后一步）。
      - name: 整理产物
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          mkdir -p dist
          cp "$(ls app/build/outputs/apk/release/*.apk | head -1)" "dist/lale-v${VERSION}.apk"
          ls -lh dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: 拉了么-v${{ steps.version.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error

      # 同版本重复推送先清掉旧 Release 与 tag，保证每次只有一份 APK，不会越堆越多。
      - name: 清理同版本旧 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request

          tok, repo, tag = os.environ["GH_TOKEN"], os.environ["REPO"], os.environ["TAG"]
          base = "https://api.github.com/repos/" + repo

          def call(method, path, body=None):
              req = urllib.request.Request(
                  base + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", "Bearer " + tok)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "gh-actions")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read()
                      return resp.status, (json.loads(raw) if raw else None)
              except urllib.error.HTTPError as err:
                  return err.code, None

          status, rel = call("GET", "/releases/tags/" + tag)
          if status == 200 and rel:
              call("DELETE", "/releases/" + str(rel["id"]))
              print("已删除旧 Release", tag)
          else:
              print("没有同版本旧 Release，跳过")
          print("清理 tag 返回:", call("DELETE", "/git/refs/tags/" + tag)[0])
          PY

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: 拉了么 v${{ steps.version.outputs.name }}
          files: dist/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true

      # $GITHUB_ENV / 文件名会把非 ASCII 吞掉，但 YAML 字面量里的中文没问题，
      # 所以这里用 env 传入中文名，再通过 API 给资产改名。
      - name: 修正 APK 资产名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: v${{ steps.version.outputs.name }}
          APK_NAME: 拉了么-v${{ steps.version.outputs.name }}.apk
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          tok, repo, tag = os.environ["GH_TOKEN"], os.environ["REPO"], os.environ["TAG"]
          target = os.environ["APK_NAME"]
          base = "https://api.github.com/repos/" + repo

          def call(method, path, body=None):
              req = urllib.request.Request(
                  base + path, method=method,
                  data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", "Bearer " + tok)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("User-Agent", "gh-actions")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
                  return json.loads(raw) if raw else None

          rel = call("GET", "/releases/tags/" + tag)
          for asset in rel.get("assets", []):
              if not asset["name"].lower().endswith(".apk"):
                  continue
              print("当前资产名:", asset["name"], "-> 目标:", target)
              if asset["name"] != target:
                  call("PATCH", "/releases/assets/" + str(asset["id"]), {"name": target})
                  print("已改名")
          print("完成")
          PY
