plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace 'com.laxiang.app'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId 'com.laxiang.app'
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 6
        versionName '2.4.0'
    }

    signingConfigs {
        release {
            if (signingPropertiesFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation platform("androidx.compose:compose-bom:$rootProject.ext.composeBomVersion")
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.activity:activity-compose:$rootProject.ext.activityVersion"
    implementation "androidx.navigation:navigation-compose:$rootProject.ext.navigationVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$rootProject.ext.lifecycleVersion"
    implementation "androidx.core:core-ktx:1.15.0"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.2'

    implementation "androidx.room:room-runtime:$rootProject.ext.roomVersion"
    implementation "androidx.room:room-ktx:$rootProject.ext.roomVersion"
    ksp "androidx.room:room-compiler:$rootProject.ext.roomVersion"

    implementation "com.squareup.okhttp3:okhttp:$rootProject.ext.okhttpVersion"
    implementation "io.coil-kt:coil-compose:$rootProject.ext.coilVersion"

    implementation "androidx.camera:camera-camera2:$rootProject.ext.cameraVersion"
    implementation "androidx.camera:camera-lifecycle:$rootProject.ext.cameraVersion"
    implementation "androidx.camera:camera-view:$rootProject.ext.cameraVersion"

    implementation "androidx.lifecycle:lifecycle-runtime-compose:$rootProject.ext.lifecycleVersion"
    implementation 'androidx.compose.material:material-icons-core'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
